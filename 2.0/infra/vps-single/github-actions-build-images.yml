name: Build AgenteZap VPS images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag, normally the commit SHA
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: ./2.0/agentezap-vercel/source
          file: ./2.0/agentezap-vercel/source/Dockerfile.vps
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/agentezap-app:${{ inputs.image_tag }}
          cache-from: type=gha,scope=agentezap-app
          cache-to: type=gha,scope=agentezap-app,mode=max

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: ./2.0/gateway-wapi/source
          file: ./2.0/gateway-wapi/source/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/agentezap-gateway:${{ inputs.image_tag }}
          cache-from: type=gha,scope=agentezap-gateway
          cache-to: type=gha,scope=agentezap-gateway,mode=max
