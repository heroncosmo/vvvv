name: Fast deploy AgenteZap VPS

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        required: true
        default: app
        type: choice
        options:
          - app
      image_tag:
        description: Artifact name without .tgz
        required: true
        type: string

jobs:
  artifact-app-only-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate artifact
        run: |
          test "${{ inputs.service }}" = "app"
          test -f "./2.0/${{ inputs.image_tag }}.tgz"

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.AGENTEZAP_VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/agentezap_vps_key
          chmod 600 ~/.ssh/agentezap_vps_key
          ssh-keyscan -H "${{ secrets.AGENTEZAP_VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload artifact
        run: |
          scp -i ~/.ssh/agentezap_vps_key \
            "./2.0/${{ inputs.image_tag }}.tgz" \
            "${{ secrets.AGENTEZAP_VPS_USER }}@${{ secrets.AGENTEZAP_VPS_HOST }}:/tmp/${{ inputs.image_tag }}.tgz"

      - name: Deploy app only
        run: |
          ssh -i ~/.ssh/agentezap_vps_key \
            "${{ secrets.AGENTEZAP_VPS_USER }}@${{ secrets.AGENTEZAP_VPS_HOST }}" \
            "set -euo pipefail; NAME='${{ inputs.image_tag }}'; rm -rf \"/tmp/\${NAME}\"; tar -xzf \"/tmp/\${NAME}.tgz\" -C /tmp; sed -i 's/\r$//' \"/tmp/\${NAME}/deploy_remote.sh\"; chmod +x \"/tmp/\${NAME}/deploy_remote.sh\"; bash \"/tmp/\${NAME}/deploy_remote.sh\""
