name: Fast deploy AgenteZap VPS

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to build/deploy
        required: true
        default: app
        type: choice
        options:
          - app
      image_tag:
        description: Image tag. Leave empty to use the commit SHA.
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: vars
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "image_tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate build context
        run: |
          test -f ./2.0/agentezap-vercel/source/package.json
          test -f ./2.0/agentezap-vercel/source/Dockerfile.vps

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: ./2.0/agentezap-vercel/source
          file: ./2.0/agentezap-vercel/source/Dockerfile.vps
          push: true
          build-args: |
            SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            PUBLIC_BASE_URL=https://agentezap.online
            APP_URL=https://agentezap.online
            VITE_PUBLIC_APP_URL=https://agentezap.online
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/agentezap-app:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha,scope=agentezap-app
          cache-to: type=gha,scope=agentezap-app,mode=max

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.AGENTEZAP_VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/agentezap_vps_key
          chmod 600 ~/.ssh/agentezap_vps_key
          ssh-keyscan -H "${{ secrets.AGENTEZAP_VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy app
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/agentezap_vps_key \
            "${{ secrets.AGENTEZAP_VPS_USER }}@${{ secrets.AGENTEZAP_VPS_HOST }}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

          ssh -i ~/.ssh/agentezap_vps_key \
            "${{ secrets.AGENTEZAP_VPS_USER }}@${{ secrets.AGENTEZAP_VPS_HOST }}" \
            "cd /opt/agentezap-single/compose && IMAGE_OWNER='${{ env.IMAGE_OWNER }}' REGISTRY='${{ env.REGISTRY }}' ./scripts/fast-deploy.sh app '${{ steps.vars.outputs.image_tag }}'"
